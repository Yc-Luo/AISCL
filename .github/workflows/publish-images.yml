name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      target:
        description: Image target to publish
        required: true
        type: choice
        default: backend
        options:
          - backend
          - frontend
          - backend-base
          - all
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  BACKEND_BASE_IMAGE: ghcr.io/yc-luo/aiscl-backend-base
  BACKEND_IMAGE: ghcr.io/yc-luo/aiscl-backend
  FRONTEND_IMAGE: ghcr.io/yc-luo/aiscl-frontend

jobs:
  publish:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed image targets
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          build_backend_base=false
          build_backend=false
          build_frontend=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ github.event.inputs.target }}" in
              backend)
                build_backend=true
                ;;
              frontend)
                build_frontend=true
                ;;
              backend-base)
                build_backend_base=true
                build_backend=true
                ;;
              all)
                build_backend_base=true
                build_backend=true
                build_frontend=true
                ;;
            esac
          elif [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            build_backend_base=true
            build_backend=true
            build_frontend=true
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"

            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              changed_files="$(git diff-tree --no-commit-id --name-only -r "$after")"
            else
              changed_files="$(git diff --name-only "$before" "$after")"
            fi

            if echo "$changed_files" | grep -Eq '^(backend/(Dockerfile\.base|pyproject\.toml|poetry\.lock))$'; then
              build_backend_base=true
              build_backend=true
            fi

            if echo "$changed_files" | grep -Eq '^backend/'; then
              build_backend=true
            fi

            if echo "$changed_files" | grep -Eq '^frontend/'; then
              build_frontend=true
            fi
          fi

          echo "backend_base=$build_backend_base" >> "$GITHUB_OUTPUT"
          echo "backend=$build_backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$build_frontend" >> "$GITHUB_OUTPUT"
          echo "Build backend base: $build_backend_base"
          echo "Build backend: $build_backend"
          echo "Build frontend: $build_frontend"

      - name: Set up Docker Buildx
        if: steps.changes.outputs.backend_base == 'true' || steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.changes.outputs.backend_base == 'true' || steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare backend base image reference
        if: steps.changes.outputs.backend == 'true'
        id: backend_base_ref
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.changes.outputs.backend_base }}" == "true" ]]; then
            echo "image=${BACKEND_BASE_IMAGE}:sha-$short_sha" >> "$GITHUB_OUTPUT"
          else
            echo "image=${BACKEND_BASE_IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata for backend
        if: steps.changes.outputs.backend == 'true'
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Docker metadata for frontend
        if: steps.changes.outputs.frontend == 'true'
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push backend base
        if: steps.changes.outputs.backend_base == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.base
          target: production
          platforms: linux/amd64
          push: true
          build-args: |
            PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
          tags: |
            ${{ env.BACKEND_BASE_IMAGE }}:latest
            ${{ env.BACKEND_BASE_IMAGE }}:sha-${{ steps.backend_base_ref.outputs.short_sha }}
          cache-from: type=gha,scope=backend-base
          cache-to: type=gha,mode=max,scope=backend-base

      - name: Build and push backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.app
          target: production
          platforms: linux/amd64
          push: true
          build-args: |
            BACKEND_BASE_IMAGE=${{ steps.backend_base_ref.outputs.image }}
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend-app
          cache-to: type=gha,mode=max,scope=backend-app

      - name: Build and push frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
